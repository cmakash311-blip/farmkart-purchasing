services:
  - type: web
    name: farmkart-purchasing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m farmkart_app.bootstrap init && uvicorn farmkart_app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
